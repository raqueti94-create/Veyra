<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Veyra App </title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
:root {
    --primario: #6c5ce7;
    --exito: #00b894;
    --peligro: #e17055;
    --fondo: #f8f9fa;
    --texto: #2d3436;
    --texto-claro: #636e72;
    --borde: #e1e5e9;
    --sombra: 0 4px 20px rgba(0,0,0,0.08);
    --transicion: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    color: var(--texto);
    line-height: 1.6;
}
.pantalla-carga {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}
.pantalla-carga.oculto { opacity: 0; visibility: hidden; }
.spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: girar 1s linear infinite;
    margin-bottom: 1rem;
}
@keyframes girar { to { transform: rotate(360deg); } }
.pantalla-carga p { color: white; font-size: 1.1rem; }
.oculto { display: none !important; visibility: hidden !important; opacity: 0 !important; height: 0 !important; overflow: hidden !important; position: absolute !important; pointer-events: none !important; }
.aparecer { animation: aparecer 0.4s ease forwards; opacity: 0; transform: translateY(15px); }
@keyframes aparecer { to { opacity: 1; transform: translateY(0); } }
.pantalla-login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 50%, #fd79a8 100%);
}
.caja-login {
    background: white;
    padding: 2rem;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    width: 100%; max-width: 420px;
    animation: aparecer 0.5s ease forwards;
    transform: translateY(20px); opacity: 0;
}
.icono-app { font-size: 4rem; text-align: center; margin-bottom: 0.5rem; display: block; }
.caja-login h1 { text-align: center; color: var(--primario); margin-bottom: 0.5rem; font-size: 2rem; font-weight: 700; }
.subtitulo { text-align: center; color: var(--texto-claro); margin-bottom: 1.5rem; font-size: 1rem; }
.grupo-input { margin-bottom: 1rem; }
.grupo-input label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: var(--texto); font-size: 0.9rem; }
.grupo-input input {
    width: 100%;
    padding: 0.9rem 1rem;
    border: 2px solid var(--borde);
    border-radius: 12px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background: #fafbfc;
}
.grupo-input input:focus {
    outline: none;
    border-color: var(--primario);
    background: white;
    box-shadow: 0 0 0 4px rgba(108,92,231,0.15);
}
.error {
    color: var(--peligro);
    margin: 0.8rem 0;
    text-align: center;
    font-weight: 500;
    min-height: 1.5rem;
}
.fila-botones { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem; }
.boton-principal {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    color: white;
    box-shadow: 0 6px 20px rgba(108,92,231,0.4);
}
.boton-principal:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(108,92,231,0.5); }
.boton-secundario {
    width: 100%;
    padding: 0.9rem;
    border: 2px solid #6c5ce7;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    background: white;
    color: #6c5ce7;
}
.boton-secundario:hover { background: #6c5ce7; color: white; }
.pantalla-principal { max-width: 1200px; margin: 0 auto; padding: 1rem; }
.cabecera {
    background: white;
    padding: 1.25rem;
    border-radius: 16px;
    box-shadow: var(--sombra);
    margin-bottom: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
}
.cabecera h2 { font-size: 1.1rem; color: var(--primario); }
.contenedor-botones-cabecera {
    display: flex;
    gap: 0.8rem;
    align-items: center;
}
.boton-cabecera {
    background: transparent;
    border: 2px solid;
    border-radius: 10px;
    padding: 0.6rem 1rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transicion);
}
.btn-cambiar-nombre {
    border-color: var(--primario);
    color: var(--primario);
}
.btn-cambiar-nombre:hover {
    background: var(--primario);
    color: white;
    transform: translateY(-2px);
}
.btn-cerrar-sesion {
    border-color: var(--peligro);
    color: var(--peligro);
}
.btn-cerrar-sesion:hover {
    background: var(--peligro);
    color: white;
    transform: translateY(-2px);
}
.navegacion { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.2rem; }
.pestaña {
    padding: 0.7rem 1.1rem;
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-size: 0.9rem;
    transition: var(--transicion);
}
.pestaña.activa { background: white; color: var(--primario); font-weight: 600; box-shadow: var(--sombra); }
.pestaña:hover:not(.activa) { background: rgba(255,255,255,0.3); }
.bloque {
    background: white;
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.2rem;
    box-shadow: var(--sombra);
}
.bloque h3 { margin-bottom: 1rem; color: var(--primario); display: flex; align-items: center; gap: 0.5rem; font-size: 1.1rem; }
.fila-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.valor-grande { font-size: 1.6rem; font-weight: 700; }
.positivo { color: var(--exito); }
.negativo { color: var(--peligro); }
.selector-tipo {
    display: flex;
    gap: 1rem;
    margin: 1.2rem 0;
}
.btn-tipo-ingreso, .btn-tipo-gasto {
    flex: 1;
    padding: 0.9rem 1rem;
    border: 2px solid var(--borde);
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    background: white;
    color: var(--texto-claro);
}
.btn-tipo-ingreso.activo { border-color: var(--exito); background: linear-gradient(135deg, #00b894 0%, #55efc4 100%); color: white; box-shadow: 0 4px 12px rgba(0,184,148,0.35); }
.btn-tipo-gasto.activo { border-color: var(--peligro); background: linear-gradient(135deg, #e17055 0%, #fab1a0 100%); color: white; box-shadow: 0 4px 12px rgba(225,112,85,0.35); }
.btn-tipo-ingreso:not(.activo):hover { border-color: var(--exito); color: var(--exito); background: #e8f5e9; }
.btn-tipo-gasto:not(.activo):hover { border-color: var(--peligro); color: var(--peligro); background: #fff0f0; }
.campos-formulario { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1rem; }
.campo-dato { flex: 1; min-width: 140px; padding: 0.85rem 1rem; border: 2px solid var(--borde); border-radius: 10px; font-size: 0.95rem; }
.btn-guardar-movimiento {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    color: white;
    box-shadow: 0 6px 16px rgba(108,92,231,0.35);
}
.btn-guardar-movimiento:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(108,92,231,0.45); }
.movimiento {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 0;
    border-bottom: 1px solid var(--borde);
    flex-wrap: wrap;
    gap: 0.5rem;
}
.info-mov { flex: 1; min-width: 160px; }
.descripcion { font-weight: 600; }
.fecha { font-size: 0.8rem; color: var(--texto-claro); margin-top: 0.2rem; }
.valor-botones { display: flex; align-items: center; gap: 0.8rem; }
.valor { font-weight: 700; font-size: 1rem; }
.acciones { display: flex; gap: 0.4rem; }
.btn-accion {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    transition: var(--transicion);
    font-size: 1rem;
}
.btn-accion:hover { background: #e1e5e9; }
.btn-editar:hover { background: #d4edda; color: #155724; }
.btn-eliminar:hover { background: #f8d7da; color: #a71d2a; }
.botones-compartir { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
.btn-whatsapp {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
    color: white; border: none; padding: 0.9rem 1.5rem; border-radius: 10px;
    font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
}
.btn-whatsapp:hover { transform: translateY(-2px); }
.btn-copiar {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
    color: white; border: none; padding: 0.9rem 1.5rem; border-radius: 10px;
    font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
}
.btn-copiar:hover { transform: translateY(-2px); }
.enlace-registro {
    text-align: center;
    margin-top: 1rem;
}
.btn-registro {
    background: none;
    border: none;
    color: var(--primario);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    font-size: 0.95rem;
}
.modal-fondo {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 1rem;
}
.modal-fondo.oculto { display: none; }
.modal-contenido {
    background: white;
    padding: 2rem;
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}
.modal-contenido h3 {
    text-align: center;
    color: var(--primario);
    margin-bottom: 1.5rem;
}
.modal-contenido input {
    width: 100%;
    padding: 0.9rem 1rem;
    border: 2px solid var(--borde);
    border-radius: 10px;
    font-size: 1rem;
    margin-bottom: 1.2rem;
}
.modal-contenido input:focus {
    outline: none;
    border-color: var(--primario);
    box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
}
.botones-modal {
    display: flex;
    gap: 0.8rem;
    justify-content: flex-end;
}
.btn-cancelar-modal {
    background: #e1e5e9;
    color: var(--texto);
    border: none;
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}
.btn-guardar-modal {
    background: var(--primario);
    color: white;
    border: none;
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}
@media (max-width: 768px) {
    .fila-doble { grid-template-columns: 1fr; }
    .selector-tipo { flex-direction: column; }
    .cabecera { flex-direction: column; text-align: center; }
    .contenedor-botones-cabecera { width: 100%; justify-content: center; }
}
    </style>
</head>
<body>

<div class="pantalla-carga" id="pantallaCarga">
    <div class="spinner"></div>
    <p>Iniciando...</p>
</div>

<div class="pantalla-login oculto" id="pantallaLogin">
    <div class="caja-login">
        <span class="icono-app">💰</span>
        <h1 id="tituloLogin">Mis Finanzas</h1>
        <p class="subtitulo" id="subtituloLogin">Ingresa tus datos para acceder</p>

        <div class="grupo-input">
            <label for="inputCorreo">Correo electrónico</label>
            <input type="email" id="inputCorreo" placeholder="tu@correo.com">
        </div>

        <div class="grupo-input" id="campoNombre">
            <label for="inputNombre">Tu Nombre</label>
            <input type="text" id="inputNombre" placeholder="Escribe tu nombre">
        </div>

        <div class="grupo-input">
            <label for="inputContraseña">Contraseña</label>
            <input type="password" id="inputContraseña" placeholder="Mínimo 6 caracteres">
        </div>

        <p class="error" id="errorLogin"></p>

        <div class="fila-botones">
            <button class="boton-principal" id="btnIngresar">Ingresar</button>
        </div>

        <div class="enlace-registro">
            <button class="btn-registro" id="btnCambiarModo">¿No tienes cuenta? Crear una</button>
        </div>
    </div>
</div>

<div class="pantalla-principal oculto" id="pantallaPrincipal">
    <header class="cabecera">
        <div>
            <h2>👋 Bienvenido, <span id="nombreUsuario">Usuario</span></h2>
        </div>
        <div class="contenedor-botones-cabecera">
            <button class="boton-cabecera btn-cambiar-nombre" id="btnCambiarNombre">✏️ Cambiar nombre</button>
            <button class="boton-cabecera btn-cerrar-sesion" id="btnCerrarSesion">🚪 Cerrar sesión</button>
        </div>
    </header>

    <nav class="navegacion">
        <button class="pestaña activa" data-pestaña="contable">📒 Contable</button>
        <button class="pestaña" data-pestaña="resumen">📊 Resumen</button>
        <button class="pestaña" data-pestaña="compartir">🔗 Compartir</button>
    </nav>

    <section class="contenido-pestaña" id="pestaña-contable">
        <div class="bloque">
            <h3>📝 Registrar Movimiento</h3>
            <div class="selector-tipo">
                <button type="button" class="btn-tipo-ingreso activo" id="btnIngreso">💰 Ingreso</button>
                <button type="button" class="btn-tipo-gasto" id="btnGasto">📉 Gasto</button>
            </div>
            <div class="campos-formulario">
                <input type="text" id="descripcionMov" class="campo-dato" placeholder="Descripción">
                <input type="number" id="valorMov" class="campo-dato" placeholder="Valor" min="0">
            </div>
            <button id="btnGuardarMov" class="btn-guardar-movimiento">✅ Guardar Movimiento</button>
        </div>
        <div class="bloque">
            <h3>📋 Mis Movimientos</h3>
            <div id="listaMovimientos"></div>
        </div>
    </section>

    <section class="contenido-pestaña oculto" id="pestaña-resumen">
        <div class="bloque">
            <h3>📊 Resumen</h3>
            <div class="fila-doble">
                <div>
                    <p>Total Ingresos</p>
                    <p class="valor-grande positivo" id="totalIngresos">$0</p>
                </div>
                <div>
                    <p>Total Gastos</p>
                    <p class="valor-grande negativo" id="totalGastos">$0</p>
                </div>
            </div>
            <div style="margin-top: 1.5rem;">
                <p>Saldo Actual</p>
                <p class="valor-grande" id="saldoActual">$0</p>
            </div>
        </div>
    </section>

    <section class="contenido-pestaña oculto" id="pestaña-compartir">
        <div class="bloque">
            <h3>🔗 Compartir App</h3>
            <p>Comparte esta herramienta:</p>
            <div class="botones-compartir">
                <button class="btn-whatsapp" id="btnCompartirWsp">💬 WhatsApp</button>
                <button class="btn-copiar" id="btnCopiarEnlace">📋 Copiar Enlace</button>
            </div>
        </div>
    </section>
</div>

<div class="modal-fondo oculto" id="modalNombre">
    <div class="modal-contenido">
        <h3>✏️ Cambiar Nombre</h3>
        <input type="text" id="inputNuevoNombre" placeholder="Escribe tu nuevo nombre">
        <div class="botones-modal">
            <button class="btn-cancelar-modal" id="btnCancelarNombre">Cancelar</button>
            <button class="btn-guardar-modal" id="btnGuardarNombre">Guardar</button>
        </div>
    </div>
</div>

<script>
// ===== CONFIGURACIÓN FIREBASE =====
const firebaseConfig = {
    apiKey: "AIzaSyAs3VpOIRciEf-eFgbmGV1-t7zX1WUNgqc",
    authDomain: "veyra-faa0e.firebaseapp.com",
    projectId: "veyra-faa0e",
    storageBucket: "veyra-faa0e.firebasestorage.app",
    messagingSenderId: "100478048311",
    appId: "1:100478048311:web:c103f0ecf7b33ebf5387b2",
    measurementId: "G-KW7ZE24BQ8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ===== VARIABLES =====
let usuarioActual = null;
let tipoMovimiento = 'ingreso';
let modoEdicionId = null;
let esRegistro = false;

// ===== AUXILIARES =====
function el(id) { return document.getElementById(id); }
function formatearMonto(valor) {
    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP' }).format(valor || 0);
}

// ===== CAMBIAR ENTRE INICIO SESIÓN Y REGISTRO =====
el('btnCambiarModo').addEventListener('click', () => {
    esRegistro = !esRegistro;
    el('campoNombre').style.display = esRegistro ? 'block' : 'none';
    el('tituloLogin').textContent = esRegistro ? 'Crear Cuenta' : 'Mis Finanzas';
    el('subtituloLogin').textContent = esRegistro ? 'Completa tus datos' : 'Ingresa para continuar';
    el('btnIngresar').textContent = esRegistro ? 'Crear Cuenta' : 'Ingresar';
    el('btnCambiarModo').textContent = esRegistro ? '¿Ya tienes cuenta? Ingresar' : '¿No tienes cuenta? Crear una';
    el('errorLogin').textContent = '';
});

// ===== INGRESO / REGISTRO =====
el('btnIngresar').addEventListener('click', async () => {
    const correo = el('inputCorreo').value.trim();
    const contraseña = el('inputContraseña').value;
    const nombre = el('inputNombre').value.trim();
    el('errorLogin').textContent = '';

    if (!correo || !contraseña) {
        el('errorLogin').textContent = 'Completa todos los campos';
        return;
    }
    if (esRegistro && !nombre) {
        el('errorLogin').textContent = 'Escribe tu nombre';
        return;
    }

    try {
        let credencial;
        if (esRegistro) {
            credencial = await auth.createUserWithEmailAndPassword(correo, contraseña);
            await credencial.user.updateProfile({ displayName: nombre });
            await credencial.user.reload();
        } else {
            credencial = await auth.signInWithEmailAndPassword(correo, contraseña);
        }
    } catch (error) {
        console.error('Error:', error);
        let mensaje = 'No se pudo completar la operación';
        switch (error.code) {
            case 'auth/invalid-email': mensaje = 'El correo no es válido'; break;
            case 'auth/user-not-found': mensaje = 'No existe cuenta con este correo'; break;
            case 'auth/wrong-password': mensaje = 'Contraseña incorrecta'; break;
            case 'auth/email-already-in-use': mensaje = 'Este correo ya está registrado'; break;
            case 'auth/weak-password': mensaje = 'La contraseña debe tener al menos 6 caracteres'; break;
        }
        el('errorLogin').textContent = mensaje;
    }
});

// ===== OBSERVADOR DE SESIÓN =====
auth.onAuthStateChanged(usuario => {
    el('pantallaCarga').classList.add('oculto');
    if (usuario) {
        usuarioActual = usuario;
        const nombre = usuario.displayName || usuario.email.split('@')[0];
        el('nombreUsuario').textContent = nombre;
        el('pantallaLogin').classList.add('oculto');
        el('pantallaPrincipal').classList.remove('oculto');
        cargarMovimientos();
    } else {
        usuarioActual = null;
        el('pantallaPrincipal').classList.add('oculto');
        el('pantallaLogin').classList.remove('oculto');
        el('campoNombre').style.display = 'none';
        esRegistro = false;
        el('tituloLogin').textContent = 'Mis Finanzas';
        el('subtituloLogin').textContent = 'Ingresa para continuar';
        el('btnIngresar').textContent = 'Ingresar';
        el('btnCambiarModo').textContent = '¿No tienes cuenta? Crear una';
    }
});

// ===== CAMBIAR NOMBRE =====
el('btnCambiarNombre').addEventListener('click', () => {
    const nombreActual = el('nombreUsuario').textContent;
    el('inputNuevoNombre').value = nombreActual;
    el('modalNombre').classList.remove('oculto');
});
el('btnCancelarNombre').addEventListener('click', () => {
    el('modalNombre').classList.add('oculto');
});
el('btnGuardarNombre').addEventListener('click', async () => {
    const nuevoNombre = el('inputNuevoNombre').value.trim();
    if (!nuevoNombre) {
        alert('Escribe un nombre válido');
        return;
    }
    if (!usuarioActual) return;
    try {
        await usuarioActual.updateProfile({ displayName: nuevoNombre });
        el('nombreUsuario').textContent = nuevoNombre;
        el('modalNombre').classList.add('oculto');
        alert('Nombre actualizado ✅');
    } catch (error) {
        alert('Error al cambiar el nombre: ' + error.message);
    }
});

// ===== NAVEGACIÓN =====
document.querySelectorAll('.pestaña').forEach(boton => {
    boton.addEventListener('click', () => {
        document.querySelectorAll('.pestaña').forEach(p => p.classList.remove('activa'));
        boton.classList.add('activa');
        const id = boton.dataset.pestaña;
        document.querySelectorAll('.contenido-pestaña').forEach(c => c.classList.add('oculto'));
        el(`pestaña-${id}`).classList.remove('oculto');
    });
});

// ===== CAMBIAR TIPO =====
el('btnIngreso').addEventListener('click', () => {
    tipoMovimiento = 'ingreso';
    el('btnIngreso').classList.add('activo');
    el('btnGasto').classList.remove('activo');
});
el('btnGasto').addEventListener('click', () => {
    tipoMovimiento = 'gasto';
    el('btnGasto').classList.add('activo');
    el('btnIngreso').classList.remove('activo');
});

// ===== GUARDAR MOVIMIENTO =====
el('btnGuardarMov').addEventListener('click', async () => {
    if (!usuarioActual) return;
    const descripcion = el('descripcionMov').value.trim();
    const valor = parseFloat(el('valorMov').value);
    if (!descripcion || isNaN(valor) || valor <= 0) {
        alert('Completa todos los datos correctamente');
        return;
    }
    const datos = {
        uid: usuarioActual.uid,
        descripcion,
        valor,
        tipo: tipoMovimiento,
        fecha: new Date().toISOString()
    };
    try {
        if (modoEdicionId) {
            await db.collection('movimientos').doc(modoEdicionId).update(datos);
            modoEdicionId = null;
            el('btnGuardarMov').textContent = '✅ Guardar Movimiento';
        } else {
            await db.collection('movimientos').add(datos);
        }
        el('descripcionMov').value = '';
        el('valorMov').value = '';
        cargarMovimientos();
    } catch (err) {
        alert('Error: ' + err.message);
    }
});

// ===== CARGAR SOLO TUS MOVIMIENTOS =====
async function cargarMovimientos() {
    if (!usuarioActual) return;
    const lista = el('listaMovimientos');
    lista.innerHTML = '<p>Cargando...</p>';
    try {
        const snap = await db.collection('movimientos')
            .where('uid', '==', usuarioActual.uid)
            .orderBy('fecha', 'desc')
            .get();
        lista.innerHTML = '';
        let totalIng = 0, totalGas = 0;
        if (snap.empty) {
            lista.innerHTML = '<p style="color:var(--texto-claro);text-align:center;padding:1rem;">Aún no tienes movimientos</p>';
        }
        snap.forEach(doc => {
            const m = doc.data();
            const f = new Date(m.fecha).toLocaleString('es-CO', {
                day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
            });
            if (m.tipo === 'ingreso') totalIng += m.valor;
            else totalGas += m.valor;
            lista.innerHTML += `
                <div class="movimiento">
                    <div class="info-mov">
                        <p class="descripcion">${m.descripcion}</p>
                        <p class="fecha">${f}</p>
                    </div>
                    <div class="valor-botones">
                        <p class="valor ${m.tipo==='ingreso'?'positivo':'negativo'}">
                            ${m.tipo==='ingreso'?'+':'-'}${formatearMonto(m.valor)}
                        </p>
                        <div class="acciones">
                            <button class="btn-accion btn-editar" data-id="${doc.id}">✏️</button>
                            <button class="btn-accion btn-eliminar" data-id="${doc.id}">🗑️</button>
                        </div>
                    </div>
                </div>`;
        });
        el('totalIngresos').textContent = formatearMonto(totalIng);
        el('totalGastos').textContent = formatearMonto(totalGas);
        el('saldoActual').textContent = formatearMonto(totalIng - totalGas);
        
        document.querySelectorAll('.btn-editar').forEach(b => b.onclick = () => editar(b.dataset.id));
        document.querySelectorAll('.btn-eliminar').forEach(b => b.onclick = () => eliminar(b.dataset.id));
    } catch (err) {
        lista.innerHTML = `<p style="color:var(--peligro);">Error: ${err.message}</p>`;
    }
}

// ===== EDITAR =====
async function editar(id) {
    const doc = await db.collection('movimientos').doc(id).get();
    if (!doc.exists) return;
    const d = doc.data();
    el('descripcionMov').value = d.descripcion;
    el('valorMov').value = d.valor;
    tipoMovimiento = d.tipo;
    if (d.tipo === 'ingreso') {
        el('btnIngreso').classList.add('activo');
        el('btnGasto').classList.remove('activo');
    } else {
        el('btnGasto').classList.add('activo');
        el('btnIngreso').classList.remove('activo');
    }
    modoEdicionId = id;
    el('btnGuardarMov').textContent = '🔄 Actualizar Movimiento';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== ELIMINAR =====
async function eliminar(id) {
    if (!confirm('¿Eliminar este movimiento?')) return;
    await db.collection('movimientos').doc(id).delete();
    cargarMovimientos();
}

// ===== COMPARTIR =====
el('btnCompartirWsp').onclick = () => {
    const t = encodeURIComponent('Mira esta app para controlar tus finanzas: ' + window.location.href);
    window.open(`https://wa.me/?text=${t}`, '_blank');
};
el('btnCopiarEnlace').onclick = async () => {
    await navigator.clipboard.writeText(window.location.href);
    alert('¡Enlace copiado!');
};

// ===== CERRAR SESIÓN =====
el('btnCerrarSesion').onclick = async () => {
    if (!confirm('¿Cerrar sesión?')) return;
    await auth.signOut();
};
</script>
