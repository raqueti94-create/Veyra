<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Control de Gastos e Ingresos</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
:root {
    --primario: #6c5ce7;
    --primario-oscuro: #5549d1;
    --exito: #00b894;
    --advertencia: #fdcb6e;
    --peligro: #e17055;
    --fondo: #f8f9fa;
    --texto: #2d3436;
    --texto-claro: #636e72;
    --borde: #e1e5e9;
    --sombra: 0 4px 20px rgba(0,0,0,0.08);
    --transicion: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    color: var(--texto);
    line-height: 1.6;
}
.pantalla-carga {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}
.pantalla-carga.oculto { opacity: 0; visibility: hidden; }
.spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: girar 1s linear infinite;
    margin-bottom: 1rem;
}
@keyframes girar { to { transform: rotate(360deg); } }
.pantalla-carga p { color: white; font-size: 1.1rem; }
.oculto {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    height: 0 !important;
    overflow: hidden !important;
    position: absolute !important;
    pointer-events: none !important;
}
.aparecer {
    animation: aparecer 0.4s ease forwards;
    opacity: 0; transform: translateY(15px);
}
@keyframes aparecer { to { opacity: 1; transform: translateY(0); } }
.escala-hover { transition: var(--transicion); }
.escala-hover:hover { transform: scale(1.02); }
.pantalla-login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 50%, #fd79a8 100%);
}
.caja-login {
    background: white;
    padding: 3rem 2rem;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    width: 100%; max-width: 440px;
    animation: aparecer 0.5s ease forwards;
    transform: translateY(20px); opacity: 0;
}
.icono-app {
    font-size: 4.5rem;
    text-align: center;
    margin-bottom: 0.5rem;
    display: block;
}
.caja-login h1 {
    text-align: center;
    color: var(--primario);
    margin-bottom: 0.5rem;
    font-size: 2.2rem;
    font-weight: 700;
}
.subtitulo {
    text-align: center;
    color: var(--texto-claro);
    margin-bottom: 2rem;
    font-size: 1.05rem;
}
.grupo-input { margin-bottom: 1.5rem; }
.grupo-input label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--texto);
    font-size: 0.95rem;
}
.grupo-input input {
    width: 100%;
    padding: 1rem 1.25rem;
    border: 2px solid var(--borde);
    border-radius: 14px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background: #fafbfc;
}
.grupo-input input:focus {
    outline: none;
    border-color: var(--primario);
    background: white;
    box-shadow: 0 0 0 4px rgba(108,92,231,0.15);
    transform: translateY(-2px);
}
.error {
    color: var(--peligro);
    margin-top: 1rem;
    margin-bottom: 0.5rem;
    text-align: center;
    font-weight: 500;
    min-height: 1.5rem;
    font-size: 0.95rem;
}
.fila-botones {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-top: 1.5rem;
}
.boton-principal {
    width: 100%;
    padding: 1.1rem;
    border: none;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    color: white;
    box-shadow: 0 6px 20px rgba(108,92,231,0.4);
}
.boton-principal:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(108,92,231,0.5);
}
.boton-secundario {
    width: 100%;
    padding: 1.1rem;
    border: 2px solid #6c5ce7;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    background: white;
    color: #6c5ce7;
}
.boton-secundario:hover {
    background: #6c5ce7;
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(108,92,231,0.35);
}
.pantalla-principal {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem;
}
.cabecera {
    background: white;
    padding: 1.5rem;
    border-radius: 16px;
    box-shadow: var(--sombra);
    margin-bottom: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
}
.cabecera h2 { font-size: 1.3rem; color: var(--primario); }
.btn-cerrar, .boton-icono, button:not(.btn):not(.pestaña) {
    background: none;
    border: none;
    color: var(--texto-claro);
    cursor: pointer;
    font-size: 0.95rem;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    transition: var(--transicion);
}
.btn-cerrar:hover, .boton-icono:hover {
    background: #f1f2f6;
    color: var(--peligro);
}
.alerta-saldo {
    padding: 1rem 1.25rem;
    border-radius: 12px;
    margin-bottom: 1.25rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    animation: aparecer 0.4s ease forwards;
}
.alerta-critica {
    background: #fff0f0;
    border-left: 4px solid var(--peligro);
    color: #c0392b;
}
.alerta-baja {
    background: #fff9e6;
    border-left: 4px solid var(--advertencia);
    color: #d35400;
}
.saldo-semanal {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: #e8f5e9;
    padding: 0.75rem 1.25rem;
    border-radius: 12px;
    border-left: 4px solid #00b894;
    font-weight: 600;
    color: #155724;
    margin-bottom: 1rem;
}
.navegacion {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
}
.pestaña {
    padding: 0.8rem 1.2rem;
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-size: 0.95rem;
    transition: var(--transicion);
}
.pestaña.activa {
    background: white;
    color: var(--primario);
    font-weight: 600;
    box-shadow: var(--sombra);
}
.pestaña:hover:not(.activa) { background: rgba(255,255,255,0.35); }
.bloque {
    background: white;
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--sombra);
}
.bloque h3 {
    margin-bottom: 1.2rem;
    color: var(--primario);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.25rem;
}
.fila-doble {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}
.valor-grande { font-size: 1.8rem; font-weight: 700; }
.positivo { color: var(--exito); }
.negativo { color: var(--peligro); }
select, input[type="number"], input[type="text"] {
    border-radius: 10px;
    border: 2px solid var(--borde);
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    transition: var(--transicion);
}
select:focus, input:focus {
    outline: none;
    border-color: var(--primario);
    box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
}
.movimiento {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    border-bottom: 1px solid var(--borde);
    transition: var(--transicion);
    flex-wrap: wrap;
    gap: 0.5rem;
}
.movimiento:hover { background: #f8f9fa; }
.info-mov { flex: 1; min-width: 180px; }
.fecha { font-size: 0.85rem; color: var(--texto-claro); }
.descripcion { font-weight: 600; margin: 0.2rem 0; }
.valor-botones { display: flex; align-items: center; gap: 0.8rem; }
.valor { font-weight: 700; font-size: 1.05rem; }
.acciones { display: flex; gap: 0.4rem; }
.btn-accion {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.4rem;
    border-radius: 6px;
    transition: var(--transicion);
    font-size: 1rem;
}
.btn-accion:hover { background: #e1e5e9; }
.btn-editar:hover { background: #d4edda; color: #155724; }
.btn-eliminar:hover { background: #f8d7da; color: #a71d2a; }
.selector-tipo {
    display: flex !important;
    gap: 1rem !important;
    justify-content: flex-start !important;
    margin: 1.5rem 0 1.25rem !important;
    width: 100% !important;
}
.btn-tipo-ingreso,
.btn-tipo-gasto {
    flex: 0 0 auto !important;
    min-width: 140px !important;
    padding: 1rem 1.5rem !important;
    border: 2px solid var(--borde) !important;
    border-radius: 14px !important;
    font-size: 1rem !important;
    font-weight: 700 !important;
    cursor: pointer !important;
    transition: all 0.3s ease !important;
    background: white !important;
    color: var(--texto-claro) !important;
    text-align: center !important;
}
.btn-tipo-ingreso.activo {
    border-color: var(--exito) !important;
    background: linear-gradient(135deg, #00b894 0%, #55efc4 100%) !important;
    color: white !important;
    box-shadow: 0 4px 12px rgba(0,184,148,0.35) !important;
}
.btn-tipo-gasto.activo {
    border-color: var(--peligro) !important;
    background: linear-gradient(135deg, #e17055 0%, #fab1a0 100%) !important;
    color: white !important;
    box-shadow: 0 4px 12px rgba(225,112,85,0.35) !important;
}
.btn-tipo-ingreso:not(.activo):hover {
    border-color: var(--exito) !important;
    color: var(--exito) !important;
    background: #e8f5e9 !important;
}
.btn-tipo-gasto:not(.activo):hover {
    border-color: var(--peligro) !important;
    color: var(--peligro) !important;
    background: #fff0f0 !important;
}
.campos-formulario {
    display: flex !important;
    gap: 0.8rem !important;
    flex-wrap: wrap !important;
    margin-bottom: 1.5rem !important;
    width: 100% !important;
}
.campo-dato {
    flex: 1 !important;
    min-width: 150px !important;
    padding: 0.9rem 1rem !important;
    border: 2px solid var(--borde) !important;
    border-radius: 12px !important;
    font-size: 0.95rem !important;
}
.btn-guardar-movimiento {
    margin-top: 1.5rem !important;
    padding: 1rem 2rem !important;
    border: none !important;
    border-radius: 14px !important;
    font-size: 1.05rem !important;
    font-weight: 700 !important;
    cursor: pointer !important;
    transition: all 0.3s ease !important;
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%) !important;
    color: white !important;
    box-shadow: 0 6px 16px rgba(108,92,231,0.35) !important;
    width: 100% !important;
}
.btn-guardar-movimiento:hover {
    transform: translateY(-3px) !important;
    box-shadow: 0 10px 24px rgba(108,92,231,0.45) !important;
}
.botones-compartir {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-top: 1rem;
}
.btn-whatsapp {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
    color: white;
    border: none;
    padding: 0.9rem 1.5rem;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(37,211,102,0.35);
}
.btn-whatsapp:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(37,211,102,0.45);
}
.btn-copiar {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
    color: white;
    border: none;
    padding: 0.9rem 1.5rem;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(0,123,255,0.35);
}
.btn-copiar:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,123,255,0.45);
}
.btn-cerrar-sesion,
.btn-cambiar-nombre {
    background: transparent;
    border: 2px solid var(--primario);
    color: var(--primario);
    border-radius: 10px;
    padding: 0.6rem 1.2rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transicion);
}
.btn-cerrar-sesion:hover,
.btn-cambiar-nombre:hover {
    background: var(--primario);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(108,92,231,0.25);
}
.acciones-usuario {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.5rem;
}
.modal-fondo {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 1rem;
}
.modal-fondo.oculto { display: none; }
.modal-contenido {
    background: white;
    padding: 2rem;
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    animation: aparecer 0.3s ease forwards;
}
.modal-contenido h3 {
    text-align: center;
    color: var(--primario);
    margin-bottom: 1.5rem;
}
.modal-contenido input {
    width: 100%;
    padding: 0.9rem 1rem;
    border: 2px solid var(--borde);
    border-radius: 10px;
    font-size: 1rem;
    margin-bottom: 1.2rem;
}
.modal-contenido input:focus {
    outline: none;
    border-color: var(--primario);
    box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
}
.botones-modal {
    display: flex;
    gap: 0.8rem;
    justify-content: flex-end;
}
.btn-cancelar { background: #e1e5e9; color: var(--texto); }
.btn-guardar { background: var(--primario); color: white; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
@media (max-width: 768px) {
    .fila-doble { grid-template-columns: 1fr; }
    .pestaña { padding: 0.7rem 0.9rem; font-size: 0.85rem; }
    .cabecera { flex-direction: column; text-align: center; }
    .valor-grande { font-size: 1.4rem; }
    .movimiento { flex-direction: column; align-items: flex-start; }
    .valor-botones { width: 100%; justify-content: space-between; }
    .selector-tipo { flex-direction: column; }
    .btn-tipo-ingreso,
    .btn-tipo-gasto { width: 100%; }
}
@media (max-width: 480px) {
    .caja-login { padding: 2rem 1.5rem; border-radius: 20px; }
    .icono-app { font-size: 3.8rem; }
    .caja-login h1 { font-size: 1.8rem; }
}
    </style>
</head>
<body>

<div class="pantalla-carga" id="pantallaCarga">
    <div class="spinner"></div>
    <p>Iniciando...</p>
</div>

<div class="pantalla-login oculto" id="pantallaLogin">
    <div class="caja-login">
        <span class="icono-app">💰</span>
        <h1>Mis Finanzas</h1>
        <p class="subtitulo">Registra y controla tus ingresos y gastos</p>
        <div class="grupo-input">
            <label for="inputNombre">Tu Nombre</label>
            <input type="text" id="inputNombre" placeholder="Escribe tu nombre">
        </div>
        <div class="fila-botones">
            <button class="boton-principal" id="btnIngresar">Ingresar</button>
        </div>
        <p class="error" id="errorLogin"></p>
    </div>
</div>

<div class="pantalla-principal oculto" id="pantallaPrincipal">
    <header class="cabecera">
        <div>
            <h2>👋 Bienvenido, <span id="nombreUsuario">Usuario</span></h2>
            <div class="acciones-usuario">
                <button class="btn-cambiar-nombre" id="btnCambiarNombre">✏️ Cambiar nombre</button>
                <button class="btn-cerrar-sesion" id="btnCerrarSesion">🚪 Cerrar sesión</button>
            </div>
        </div>
    </header>

    <nav class="navegacion">
        <button class="pestaña activa" data-pestaña="contable">📒 Contable</button>
        <button class="pestaña" data-pestaña="resumen">📊 Resumen</button>
        <button class="pestaña" data-pestaña="compartir">🔗 Compartir</button>
    </nav>

    <section class="contenido-pestaña" id="pestaña-contable">
        <div class="bloque">
            <h3>📝 Registrar Movimiento</h3>
            <div class="selector-tipo">
                <button type="button" class="btn-tipo-ingreso activo" id="btnIngreso">💰 Ingreso</button>
                <button type="button" class="btn-tipo-gasto" id="btnGasto">📉 Gasto</button>
            </div>
            <div class="campos-formulario">
                <input type="text" id="descripcionMov" class="campo-dato" placeholder="Descripción">
                <input type="number" id="valorMov" class="campo-dato" placeholder="Valor" min="0">
            </div>
            <button id="btnGuardarMov" class="btn-guardar-movimiento">✅ Guardar Movimiento</button>
        </div>
        <div class="bloque">
            <h3>📋 Movimientos</h3>
            <div id="listaMovimientos"></div>
        </div>
    </section>

    <section class="contenido-pestaña oculto" id="pestaña-resumen">
        <div class="bloque">
            <h3>📊 Resumen del Mes</h3>
            <div class="fila-doble">
                <div>
                    <p>Total Ingresos</p>
                    <p class="valor-grande positivo" id="totalIngresos">$0</p>
                </div>
                <div>
                    <p>Total Gastos</p>
                    <p class="valor-grande negativo" id="totalGastos">$0</p>
                </div>
            </div>
            <div style="margin-top: 1.5rem;">
                <p>Saldo Actual</p>
                <p class="valor-grande" id="saldoActual">$0</p>
            </div>
        </div>
    </section>

    <section class="contenido-pestaña oculto" id="pestaña-compartir">
        <div class="bloque">
            <h3>🔗 Compartir App</h3>
            <p>Comparte esta herramienta con tus amigos:</p>
            <div class="botones-compartir">
                <button class="btn-whatsapp" id="btnCompartirWsp">💬 WhatsApp</button>
                <button class="btn-copiar" id="btnCopiarEnlace">📋 Copiar Enlace</button>
            </div>
        </div>
    </section>
</div>

<div class="modal-fondo oculto" id="modalNombre">
    <div class="modal-contenido">
        <h3>✏️ Cambiar Nombre</h3>
        <input type="text" id="inputNuevoNombre" placeholder="Escribe tu nuevo nombre">
        <div class="botones-modal">
            <button class="btn-cancelar" id="btnCancelarNombre">Cancelar</button>
            <button class="btn-guardar" id="btnGuardarNombre">Guardar</button>
        </div>
    </div>
</div>

<script>
// ===== TU CONFIGURACIÓN REAL DE FIREBASE =====
const firebaseConfig = {
    apiKey: "AIzaSyAs3VpOIRciEf-eFgbmGV1-t7zX1WUNgqc",
    authDomain: "veyra-faa0e.firebaseapp.com",
    projectId: "veyra-faa0e",
    storageBucket: "veyra-faa0e.firebasestorage.app",
    messagingSenderId: "100478048311",
    appId: "1:100478048311:web:c103f0ecf7b33ebf5387b2",
    measurementId: "G-KW7ZE24BQ8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== VARIABLES =====
let nombreUsuarioGuardado = 'Usuario';
let tipoMovimiento = 'ingreso';
let modoEdicionId = null;

// ===== AUXILIARES =====
function el(id) { return document.getElementById(id); }
function formatearMonto(valor) {
    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP' }).format(valor || 0);
}

// ===== MOSTRAR PANTALLA PRINCIPAL =====
function mostrarPantallaPrincipal() {
    el('pantallaCarga').classList.add('oculto');
    el('pantallaLogin').classList.add('oculto');
    el('pantallaPrincipal').classList.remove('oculto');
    el('nombreUsuario').textContent = nombreUsuarioGuardado;
    cargarMovimientos();
}

// ===== INICIO =====
el('btnIngresar').addEventListener('click', () => {
    const nombre = el('inputNombre').value.trim();
    if (!nombre) {
        el('errorLogin').textContent = 'Por favor escribe tu nombre';
        return;
    }
    nombreUsuarioGuardado = nombre;
    localStorage.setItem('nombreUsuario', nombre);
    mostrarPantallaPrincipal();
});

// ===== NAVEGACIÓN =====
document.querySelectorAll('.pestaña').forEach(boton => {
    boton.addEventListener('click', () => {
        document.querySelectorAll('.pestaña').forEach(p => p.classList.remove('activa'));
        boton.classList.add('activa');
        const id = boton.dataset.pestaña;
        document.querySelectorAll('.contenido-pestaña').forEach(c => c.classList.add('oculto'));
        el(`pestaña-${id}`).classList.remove('oculto');
    });
});

// ===== CAMBIAR TIPO =====
el('btnIngreso').addEventListener('click', () => {
    tipoMovimiento = 'ingreso';
    el('btnIngreso').classList.add('activo');
    el('btnGasto').classList.remove('activo');
});
el('btnGasto').addEventListener('click', () => {
    tipoMovimiento = 'gasto';
    el('btnGasto').classList.add('activo');
    el('btnIngreso').classList.remove('activo');
});

// ===== GUARDAR =====
el('btnGuardarMov').addEventListener('click', async () => {
    const descripcion = el('descripcionMov').value.trim();
    const valor = parseFloat(el('valorMov').value);
    if (!descripcion || isNaN(valor) || valor <= 0) {
        alert('Completa todos los datos correctamente');
        return;
    }
    const datos = { descripcion, valor, tipo: tipoMovimiento, fecha: new Date().toISOString() };
    try {
        if (modoEdicionId) {
            await db.collection('movimientos').doc(modoEdicionId).update(datos);
            modoEdicionId = null;
            el('btnGuardarMov').textContent = '✅ Guardar Movimiento';
        } else {
            await db.collection('movimientos').add(datos);
        }
        el('descripcionMov').value = '';
        el('valorMov').value = '';
        cargarMovimientos();
    } catch (err) {
        console.error('Error:', err);
        alert('No se pudo guardar: ' + err.message);
    }
});

// ===== CARGAR LISTA =====
async function cargarMovimientos() {
    const lista = el('listaMovimientos');
    lista.innerHTML = '<p>Cargando...</p>';
    try {
        const snap = await db.collection('movimientos').orderBy('fecha', 'desc').get();
        lista.innerHTML = '';
        let totalIng = 0, totalGas = 0;
        if (snap.empty) {
            lista.innerHTML = '<p style="color:var(--texto-claro);text-align:center;padding:1rem;">Aún no hay movimientos</p>';
        }
        snap.forEach(doc => {
            const m = doc.data();
            const f = new Date(m.fecha).toLocaleString('es-CO', {
                day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
            });
            if (m.tipo === 'ingreso') totalIng += m.valor;
            else totalGas += m.valor;
            lista.innerHTML += `
                <div class="movimiento">
                    <div class="info-mov">
                        <p class="descripcion">${m.descripcion}</p>
                        <p class="fecha">${f}</p>
                    </div>
                    <div class="valor-botones">
                        <p class="valor ${m.tipo==='ingreso'?'positivo':'negativo'}">
                            ${m.tipo==='ingreso'?'+':'-'}${formatearMonto(m.valor)}
                        </p>
                        <div class="acciones">
                            <button class="btn-accion btn-editar" data-id="${doc.id}">✏️</button>
                            <button class="btn-accion btn-eliminar" data-id="${doc.id}">🗑️</button>
                        </div>
                    </div>
                </div>`;
        });
        el('totalIngresos').textContent = formatearMonto(totalIng);
        el('totalGastos').textContent = formatearMonto(totalGas);
        el('saldoActual').textContent = formatearMonto(totalIng - totalGas);
        
        // Eventos editar/eliminar
        document.querySelectorAll('.btn-editar').forEach(b => b.onclick = () => editar(b.dataset.id));
        document.querySelectorAll('.btn-eliminar').forEach(b => b.onclick = () => eliminar(b.dataset.id));
    } catch (err) {
        lista.innerHTML = `<p style="color:var(--peligro);">Error: ${err.message}</p>`;
    }
}

// ===== EDITAR =====
async function editar(id) {
    const doc = await db.collection('movimientos').doc(id).get();
    if (!doc.exists) return;
    const d = doc.data();
    el('descripcionMov').value = d.descripcion;
    el('valorMov').value = d.valor;
    tipoMovimiento = d.tipo;
    if (d.tipo === 'ingreso') {
        el('btnIngreso').classList.add('activo');
        el('btnGasto').classList.remove('activo');
    } else {
        el('btnGasto').classList.add('activo');
        el('btnIngreso').classList.remove('activo');
    }
    modoEdicionId = id;
    el('btnGuardarMov').textContent = '🔄 Actualizar Movimiento';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== ELIMINAR =====
async function eliminar(id) {
    if (!confirm('¿Eliminar este movimiento?')) return;
    await db.collection('movimientos').doc(id).delete();
    cargarMovimientos();
}

// ===== COMPARTIR =====
el('btnCompartirWsp').onclick = () => {
    const t = encodeURIComponent('Mira esta app para controlar tus finanzas: ' + window.location.href);
    window.open(`https://wa.me/?text=${t}`, '_blank');
};
el('btnCopiarEnlace').onclick = async () => {
    await navigator.clipboard.writeText(window.location.href);
    alert('¡Enlace copiado!');
};

// ===== CAMBIAR NOMBRE =====
el('btnCambiarNombre').onclick = () => {
    el('inputNuevoNombre').value = nombreUsuarioGuardado;
    el('modalNombre').classList.remove('oculto');
};
el('btnCancelarNombre').onclick = () => el('modalNombre').classList.add('oculto');
el('btnGuardarNombre').onclick = () => {
    const n = el('inputNuevoNombre').value.trim();
    if (!n) return alert('Escribe un nombre válido');
    nombreUsuarioGuardado = n;
    localStorage.setItem('nombreUsuario', n);
    el('nombreUsuario').textContent = n;
    el('modalNombre').classList.add('oculto');
};

// ===== CERRAR SESIÓN =====
el('btnCerrarSesion').onclick = () => {
    if (!confirm('¿Cerrar sesión?')) return;
    localStorage.removeItem('nombreUsuario');
    el('pantallaPrincipal').classList.add('oculto');
    el('pantallaLogin').classList.remove('oculto');
    el('inputNombre').value = '';
};

// ===== RECUPERAR SESIÓN =====
window.onload = () => {
    const guardado = localStorage.getItem('nombreUsuario');
    if (guardado) {
        nombreUsuarioGuardado = guardado;
        mostrarPantallaPrincipal();
    } else {
        el('pantallaCarga').classList.add('oculto');
        el('pantallaLogin').classList.remove('oculto');
    }
};
</script>
